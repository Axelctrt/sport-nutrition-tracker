<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="SportPilot, application locale de suivi sportif, nutritionnel, calorique et de musculation."
    />
    <script>
      (() => {
        try {
          const appearance = localStorage.getItem("sport-pilot.theme");
          const dark = appearance === "dark"
            || (
              appearance !== "light"
              && matchMedia("(prefers-color-scheme: dark)").matches
            );
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";

          const theme = localStorage.getItem("sport-pilot.active-theme");
          const themes = [
            "core",
            "neon-pulse",
            "emerald-focus",
            "aurora",
            "zenith-gold",
          ];
          document.documentElement.dataset.sportTheme = themes.includes(theme)
            ? theme
            : "core";
        } catch {
          document.documentElement.dataset.sportTheme = "core";
        }
      })();
    </script>
    <title>SportPilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
