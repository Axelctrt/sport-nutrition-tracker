name: Browser lifecycle validation

on:
  pull_request:
    branches:
      - agent/profile-friends-privacy-browser-lifecycle

permissions:
  contents: write

jobs:
  targeted-browsers:
    name: Visual harness browser lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply browser lifecycle patch
        run: |
          if [[ -f .github/scripts/apply_browser_lifecycle_fix.py ]]; then
            python3 .github/scripts/apply_browser_lifecycle_fix.py
          fi

      - name: Verify focused patch
        run: |
          git diff --check
          npx oxlint e2e/performance-glass-0.34.0.spec.ts e2e/helpers/performanceGlass.ts

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Repeat exact scenario on WebKit three times
        run: >-
          npx playwright test
          e2e/performance-glass-0.34.0.spec.ts
          --project=webkit-iphone-15
          --grep "valide les thèmes, graphiques et écrans de décision avec des données contrôlées"
          --repeat-each=3

      - name: Repeat exact scenario on Chromium mobile 360 three times
        run: >-
          npx playwright test
          e2e/performance-glass-0.34.0.spec.ts
          --project=chromium-mobile-360
          --grep "valide les thèmes, graphiques et écrans de décision avec des données contrôlées"
          --repeat-each=3

      - name: Repeat exact scenario on Chromium large 412 three times
        run: >-
          npx playwright test
          e2e/performance-glass-0.34.0.spec.ts
          --project=chromium-large-412
          --grep "valide les thèmes, graphiques et écrans de décision avec des données contrôlées"
          --repeat-each=3

      - name: Run full visual file on affected browsers
        run: >-
          npx playwright test
          e2e/performance-glass-0.34.0.spec.ts
          --project=webkit-iphone-15
          --project=chromium-mobile-360
          --project=chromium-large-412

      - name: Commit validated patch to the technical branch
        run: |
          if [[ -f .github/scripts/apply_browser_lifecycle_fix.py ]]; then
            rm .github/scripts/apply_browser_lifecycle_fix.py
          fi
          if [[ -n "$(git status --porcelain -- e2e/performance-glass-0.34.0.spec.ts .github/scripts/apply_browser_lifecycle_fix.py)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add e2e/performance-glass-0.34.0.spec.ts .github/scripts/apply_browser_lifecycle_fix.py
            git commit -m "test(e2e): adapter le cycle de page au moteur navigateur"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-lifecycle-failure
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7
