name: Profile final targeted validation

on:
  pull_request:
    branches:
      - agent/profile-friends-privacy-final-patch

permissions:
  contents: read

jobs:
  targeted-validation:
    name: Unit, E2E and targeted quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run targeted unit tests
        run: >-
          npx vitest run
          src/features/profile/components/ProfileOverview.test.tsx
          src/application/friends/friendsPrivacyService.test.ts
          src/features/friends/pages/FriendsPrivacyPage.visibility-feedback.test.tsx

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run targeted E2E scenarios
        run: >-
          npx playwright test
          e2e/profile-editing.spec.ts
          e2e/friends-navigation.spec.ts
          --project=chromium-desktop

      - name: Lint affected files
        run: >-
          npx oxlint
          src/features/profile/pages/ProfilePage.tsx
          src/features/profile/components/ProfileOverview.tsx
          src/features/profile/components/ProfileOverview.test.tsx
          src/application/friends/friendsPrivacyService.ts
          src/application/friends/friendsPrivacyService.test.ts
          src/app/friends/SocialProfileVisibilityNotifier.tsx
          src/app/providers/AppProviders.tsx
          src/features/friends/pages/FriendsPrivacyPage.visibility-feedback.test.tsx
          e2e/profile-editing.spec.ts
          e2e/friends-navigation.spec.ts

      - name: Build application
        run: npm run build
