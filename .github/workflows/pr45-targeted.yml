name: PR45 targeted validation

on:
  pull_request:
    branches:
      - validation/pr45-planning

permissions:
  contents: write

concurrency:
  group: pr45-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('src/features/strength-planning/pages/WeeklyPlanningPage.test.tsx')
          test_content = test_path.read_text(encoding='utf-8')
          old_test = "screen.getByRole('button', { name: 'Planifier', exact: true })"
          new_test = "screen.getByRole('button', { name: 'Planifier' })"
          if old_test not in test_content:
              raise SystemExit('Expected test marker not found')
          test_path.write_text(test_content.replace(old_test, new_test, 1), encoding='utf-8')

          page_path = Path('src/features/strength-planning/pages/WeeklyPlanningPage.tsx')
          page_content = page_path.read_text(encoding='utf-8')
          old_page = "        initialFocusSelector={planningMode === 'choice' ? '[data-planning-choice]' : undefined}\n"
          new_page = "        {...(planningMode === 'choice'\n          ? { initialFocusSelector: '[data-planning-choice]' }\n          : {})}\n"
          if old_page not in page_content:
              raise SystemExit('Expected BottomSheet marker not found')
          page_path.write_text(page_content.replace(old_page, new_page, 1), encoding='utf-8')
          PY

      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/strength-planning/pages/WeeklyPlanningPage.tsx \
            src/features/strength-planning/pages/WeeklyPlanningPage.test.tsx
          git commit -m "fix: corriger le typage de la surface Planning"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run targeted unit tests
        run: >-
          npm run test --
          src/features/strength-planning/pages/WeeklyPlanningPage.test.tsx
          src/features/sport/components/SportHubOverview.test.tsx
          src/app/routeMetadata.test.ts

      - name: Build application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run targeted mobile E2E
        run: npx playwright test e2e/weekly-planning.spec.ts --project=chromium-mobile-360
