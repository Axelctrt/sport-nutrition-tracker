name: PR24 edit surface browser validation

on:
  pull_request:
    branches:
      - agent/profile-friends-privacy-ux
    types:
      - synchronize

permissions:
  contents: write

jobs:
  targeted-validation:
    name: Final mobile profile edit surfaces
    if: github.head_ref == 'agent/pr24-social-profile-edit-surface-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply scoped PR24 correction
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          initial = Path('.github/workflows/pr24-edit-surface-validation.yml').read_text(encoding='utf-8')
          main = re.search(r"printf '%s' '(H4sI[^']+)'", initial)
          if not main:
              raise SystemExit('Payload principal introuvable.')
          Path('/tmp/apply-pr24-edit-surface.py').write_bytes(gzip.decompress(base64.b64decode(main.group(1))))

          final = Path('.github/workflows/pr24-edit-surface-final-validation.yml').read_text(encoding='utf-8')
          payloads = re.findall(r"printf '%s' '(H4sI[^']+)'", final)
          if len(payloads) != 2:
              raise SystemExit(f'Deux correctifs complémentaires attendus, trouvés : {len(payloads)}')
          for index, payload in enumerate(payloads, start=1):
              Path(f'/tmp/pr24-followup-{index}.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/apply-pr24-edit-surface.py
          python /tmp/pr24-followup-1.py
          python /tmp/pr24-followup-2.py
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/pr24-followup-3.py
          python /tmp/pr24-followup-3.py
          python - <<'PY'
          import re
          from pathlib import Path

          friends_path = Path('src/features/friends/pages/FriendsPrivacyPage.tsx')
          friends_source = friends_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"    return persistSocialPrivacyForAccountSync\(\n"
              r"\s+\{ \.\.\.next, lastFeedback: undefined \},\n"
              r"\s+'social-profile-settings-update',\n"
              r"\s+\);\n"
          )
          replacement = (
              "    const nextWithoutFeedback = { ...next };\n"
              "    delete nextWithoutFeedback.lastFeedback;\n"
              "    return persistSocialPrivacyForAccountSync(\n"
              "      nextWithoutFeedback,\n"
              "      'social-profile-settings-update',\n"
              "    );\n"
          )
          friends_source, count = pattern.subn(replacement, friends_source, count=1)
          if count != 1:
              raise SystemExit(f'Appel lastFeedback attendu une fois, trouvé : {count}.')
          friends_path.write_text(friends_source, encoding='utf-8')

          e2e_path = Path('e2e/friends-profile-editing.spec.ts')
          e2e_source = e2e_path.read_text(encoding='utf-8')
          old_card = "const socialCard = page.getByLabel('Profil social');"
          new_card = "const socialCard = page.getByLabel('Profil social', { exact: true });"
          if old_card not in e2e_source:
              raise SystemExit('Sélecteur non exact de la carte Profil social introuvable.')
          e2e_source = e2e_source.replace(old_card, new_card, 1)
          old_handle = "page.getByLabel('Identifiant public')"
          new_handle = "page.getByRole('textbox', { name: 'Identifiant public' })"
          if e2e_source.count(old_handle) != 2:
              raise SystemExit('Deux sélecteurs de champ Identifiant public étaient attendus.')
          e2e_source = e2e_source.replace(old_handle, new_handle)
          e2e_path.write_text(e2e_source, encoding='utf-8')
          print('Correction TypeScript et sélecteurs sémantiques appliqués.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run targeted lint
        run: npx oxlint src/shared/ui/BottomSheet.tsx src/features/profile/pages/ProfilePage.tsx src/features/profile/pages/ProfilePage.test.tsx src/features/friends/pages/FriendsPrivacyPage.tsx src/features/friends/pages/FriendsPrivacyPage.identity-status.test.tsx src/features/friends/pages/FriendsPrivacyPage.visibility-feedback.test.tsx e2e/profile-editing.spec.ts e2e/friends-profile-editing.spec.ts

      - name: Run targeted unit tests
        run: npx vitest run src/features/profile/pages/ProfilePage.test.tsx src/features/friends/pages/FriendsPrivacyPage.identity-status.test.tsx src/features/friends/pages/FriendsPrivacyPage.visibility-feedback.test.tsx

      - name: Run production build
        run: npm run build

      - name: Run targeted mobile browser tests in pinned Playwright image
        shell: bash
        run: |
          docker run --rm --ipc=host \
            -e CI=1 \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            bash -lc "npx playwright test e2e/profile-editing.spec.ts e2e/friends-profile-editing.spec.ts --project=webkit-iphone-15 --project=chromium-mobile-360"

      - name: Upload visual and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr24-edit-surface-targeted-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit validated correction on technical branch
        if: success()
        shell: bash
        run: |
          git config user.name 'sportpilot-validation-bot'
          git config user.email 'sportpilot-validation-bot@users.noreply.github.com'
          git add src/shared/ui/BottomSheet.tsx src/features/profile/pages/ProfilePage.tsx src/features/profile/pages/ProfilePage.test.tsx src/features/friends/pages/FriendsPrivacyPage.tsx src/features/friends/pages/FriendsPrivacyPage.identity-status.test.tsx src/features/friends/pages/FriendsPrivacyPage.visibility-feedback.test.tsx e2e/profile-editing.spec.ts e2e/friends-profile-editing.spec.ts
          git rm .github/workflows/pr24-edit-surface-validation.yml .github/workflows/pr24-edit-surface-pr-validation.yml .github/workflows/pr24-edit-surface-rerun.yml .github/workflows/pr24-edit-surface-final-validation.yml .github/workflows/pr24-edit-surface-browser-validation.yml .github/workflows/pr24-edit-surface-build-validation.yml .github/workflows/pr24-edit-surface-source-diagnostic.yml
          git commit -m 'fix: éditer les profils dans une surface dédiée'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
