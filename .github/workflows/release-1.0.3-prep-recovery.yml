name: Release 1.0.3 preparation recovery

on:
  push:
    branches:
      - release/1.0.3
    paths:
      - .github/workflows/release-1.0.3-prep-recovery.yml

permissions:
  contents: write

jobs:
  recover-release-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v6
        with:
          ref: release/1.0.3
          fetch-depth: 0

      - name: Extract and run corrected preparation script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/release-1.0.3-prep.yml').read_text(encoding='utf-8').splitlines()
          start = source.index("          node <<'NODE'") + 1
          end = source.index('          NODE', start)
          lines = []
          for line in source[start:end]:
              if not line.startswith('          '):
                  raise SystemExit(f'Unexpected indentation in embedded script: {line!r}')
              stripped = line[10:]
              if "Audit du socle sportif réussi" in stripped:
                  continue
              lines.append(stripped)
          Path('/tmp/release-1.0.3-prep.js').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          node /tmp/release-1.0.3-prep.js
          git diff --check
          if grep -R -F "expect(__APP_VERSION__).toBe('1.0.2');" src --include='*.ts' --include='*.tsx'; then
            echo 'Stale __APP_VERSION__ 1.0.2 assertion remains.'
            exit 1
          fi
          git status --short

      - name: Commit final release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/release-1.0.3-prep.yml
          rm .github/workflows/release-1.0.3-prep-recovery.yml
          git add -A
          git commit -m "chore(release): préparer SportPilot 1.0.3"
          git push origin HEAD:release/1.0.3
