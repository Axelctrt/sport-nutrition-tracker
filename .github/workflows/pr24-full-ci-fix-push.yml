name: PR24 full CI fix push validation

on:
  push:
    branches:
      - agent/pr24-edit-surface-full-ci-fix

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr24-edit-surface-full-ci-fix
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply scoped CI compatibility fixes
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/apply-full-ci-fix.py
          python /tmp/apply-full-ci-fix.py

      - run: npm ci

      - name: Run formerly failing tests
        run: >-
          npx vitest run
          src/shared/ui/BottomSheet.test.tsx
          src/features/friends/pages/FriendsPrivacyPage.test.tsx
          src/features/friends/pages/FriendsPrivacyPage.persistence.test.tsx
          src/features/food-journal/pages/FoodJournalPage.mobile.test.tsx
          src/app/App.test.tsx

      - name: Run complete unit suite
        run: npm test

      - name: Run shuffled suite
        run: npm run test:stability

      - name: Run lint and build
        run: npm run lint && npm run build

      - name: Commit validated fixes
        if: success()
        shell: bash
        run: |
          git config user.name 'sportpilot-validation-bot'
          git config user.email 'sportpilot-validation-bot@users.noreply.github.com'
          git add \
            src/shared/ui/BottomSheet.tsx \
            src/shared/ui/BottomSheet.test.tsx \
            src/features/friends/pages/FriendsPrivacyPage.test.tsx \
            src/features/friends/pages/FriendsPrivacyPage.persistence.test.tsx \
            src/features/food-journal/pages/FoodJournalPage.mobile.test.tsx
          git rm \
            .github/workflows/pr24-full-ci-fix-validation.yml \
            .github/workflows/pr24-full-ci-fix-push.yml
          git commit -m 'test: stabiliser la surface d’édition dans la suite complète'
          git push origin HEAD:agent/pr24-edit-surface-full-ci-fix
