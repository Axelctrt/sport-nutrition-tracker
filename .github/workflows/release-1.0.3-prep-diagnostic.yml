name: Release 1.0.3 preparation diagnostic

on:
  push:
    branches:
      - release/1.0.3
    paths:
      - .github/workflows/release-1.0.3-prep-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/1.0.3
          fetch-depth: 0

      - name: Execute corrected preparation with captured diagnostics
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/release-1.0.3-prep.yml').read_text(encoding='utf-8').splitlines()
          start = source.index("          node <<'NODE'") + 1
          end = source.index('          NODE', start)
          lines = []
          for line in source[start:end]:
              if not line.startswith('          '):
                  raise SystemExit(f'Unexpected indentation: {line!r}')
              stripped = line[10:]
              if "Audit du socle sportif réussi" in stripped:
                  continue
              lines.append(stripped)
          Path('/tmp/release-prep.js').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          node /tmp/release-prep.js >/tmp/release-prep.log 2>&1
          status=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "exit_code=$status"
              cat /tmp/release-prep.log
            } > RELEASE-1.0.3-PREP-ERROR.txt
            rm .github/workflows/release-1.0.3-prep-diagnostic.yml
            git add -A
            git commit -m "chore(release): enregistrer le diagnostic 1.0.3"
            git push origin HEAD:release/1.0.3
            exit 0
          fi

          git diff --check
          rm .github/workflows/release-1.0.3-prep.yml
          rm .github/workflows/release-1.0.3-prep-recovery.yml
          rm .github/workflows/release-1.0.3-prep-diagnostic.yml
          rm -f RELEASE-1.0.3-PREP-ERROR.txt
          git add -A
          git commit -m "chore(release): préparer SportPilot 1.0.3"
          git push origin HEAD:release/1.0.3
