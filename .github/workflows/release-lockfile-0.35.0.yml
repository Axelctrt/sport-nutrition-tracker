name: Finalize release lockfile 0.35.0

on:
  push:
    branches:
      - release/0.35.0

permissions:
  contents: write

concurrency:
  group: release-lockfile-0.35.0
  cancel-in-progress: false

jobs:
  align-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/0.35.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Align npm release metadata
        run: npm version 0.35.0 --no-git-tag-version --allow-same-version

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Release metadata already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): aligner le lockfile 0.35.0"
          git push origin HEAD:release/0.35.0
