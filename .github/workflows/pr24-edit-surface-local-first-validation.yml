name: PR24 edit surface local-first validation

on:
  pull_request:
    branches:
      - agent/profile-friends-privacy-ux
    types:
      - synchronize

permissions:
  contents: write

jobs:
  targeted-validation:
    name: Local-first profile edit surfaces
    if: github.head_ref == 'agent/pr24-social-profile-edit-surface-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply validated edit-surface correction
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          initial = Path('.github/workflows/pr24-edit-surface-validation.yml').read_text(encoding='utf-8')
          main = re.search(r"printf '%s' '(H4sI[^']+)'", initial)
          if not main:
              raise SystemExit('Payload principal introuvable.')
          Path('/tmp/main.py').write_bytes(gzip.decompress(base64.b64decode(main.group(1))))

          final = Path('.github/workflows/pr24-edit-surface-final-validation.yml').read_text(encoding='utf-8')
          payloads = re.findall(r"printf '%s' '(H4sI[^']+)'", final)
          if len(payloads) != 2:
              raise SystemExit(f'Deux correctifs complémentaires attendus, trouvés : {len(payloads)}')
          for index, payload in enumerate(payloads, start=1):
              Path(f'/tmp/followup-{index}.py').write_bytes(gzip.decompress(base64.b64decode(payload)))

          browser = Path('.github/workflows/pr24-edit-surface-browser-validation.yml').read_text(encoding='utf-8')
          browser_payloads = re.findall(r"printf '%s' '(H4sI[^']+)'", browser)
          if not browser_payloads:
              raise SystemExit('Correctif de sélecteur introuvable.')
          Path('/tmp/followup-3.py').write_bytes(gzip.decompress(base64.b64decode(browser_payloads[-1])))
          PY
          python /tmp/main.py
          python /tmp/followup-1.py
          python /tmp/followup-2.py
          python /tmp/followup-3.py
          python - <<'PY'
          import re
          from pathlib import Path

          friends_path = Path('src/features/friends/pages/FriendsPrivacyPage.tsx')
          friends_source = friends_path.read_text(encoding='utf-8')

          optional_pattern = re.compile(
              r"    return persistSocialPrivacyForAccountSync\(\n"
              r"\s+\{ \.\.\.next, lastFeedback: undefined \},\n"
              r"\s+'social-profile-settings-update',\n"
              r"\s+\);\n"
          )
          optional_replacement = (
              "    const nextWithoutFeedback = { ...next };\n"
              "    delete nextWithoutFeedback.lastFeedback;\n"
              "    return persistSocialPrivacyForAccountSync(\n"
              "      nextWithoutFeedback,\n"
              "      'social-profile-settings-update',\n"
              "    );\n"
          )
          friends_source, optional_count = optional_pattern.subn(
              optional_replacement,
              friends_source,
              count=1,
          )
          if optional_count != 1:
              raise SystemExit(f'Correction lastFeedback attendue une fois, trouvée : {optional_count}.')

          cloud_pattern = re.compile(
              r"        if \(accountUserId && activeCloudIdentityPort\) \{\n"
              r"          reportIdentitySuccess\(result\.message\);\n"
              r"          closeIdentityEditor\(\);\n"
              r"          return;\n"
              r"        \}\n\n"
              r"        if \(!activeCloudIdentityPort\) \{\n"
              r"          reportIdentitySuccess\(result\.message\);\n"
              r"          closeIdentityEditor\(\);\n"
              r"          return;\n"
              r"        \}\n\n"
              r"        const cloudResult = await activeCloudIdentityPort\.publishIdentity\(result\.identity\);\n"
              r"        if \(\['created', 'updated', 'alreadyExists'\]\.includes\(cloudResult\.status\)\) \{\n"
              r"          reportIdentitySuccess\(`\$\{result\.message\} \$\{cloudResult\.message\}`\);\n"
              r"          closeIdentityEditor\(\);\n"
              r"          return;\n"
              r"        \}\n\n"
              r"        setIdentityNotice\(\{\n"
              r"          tone: 'warning',\n"
              r"          title: 'Profil enregistré, publication à reprendre',\n"
              r"          message: `La sauvegarde locale a réussi, mais la publication cloud n’a pas abouti : \$\{cloudResult\.message\}`,\n"
              r"        \}\);\n"
              r"        closeIdentityEditor\(\);"
          )
          cloud_replacement = (
              "        reportIdentitySuccess(result.message);\n"
              "        closeIdentityEditor();"
          )
          friends_source, cloud_count = cloud_pattern.subn(
              cloud_replacement,
              friends_source,
              count=1,
          )
          if cloud_count != 1:
              raise SystemExit(f'Flux cloud local attendu une fois, trouvé : {cloud_count}.')
          friends_path.write_text(friends_source, encoding='utf-8')

          test_path = Path('src/features/friends/pages/FriendsPrivacyPage.identity-status.test.tsx')
          test_source = test_path.read_text(encoding='utf-8')
          partial_pattern = re.compile(
              r"  it\('signale une réussite partielle sans toast de succès lorsque le cloud échoue', async \(\) => \{.*?\n  \}\);\n\n"
              r"(?=  it\('ignore la réponse obsolète)",
              re.DOTALL,
          )
          local_first_test = """  it('enregistre le profil local sans tenter une publication cloud', async () => {
    const repository: SocialIdentityRepository = {
      readIdentity: vi.fn().mockResolvedValue(identity),
      saveIdentity: vi.fn().mockResolvedValue(undefined),
    };
    const cloudIdentityPort: SocialCloudIdentityPort = {
      readCurrentIdentity: vi.fn().mockResolvedValue(undefined),
      reserveHandle: vi.fn().mockResolvedValue({
        status: 'unavailable',
        message: 'Réservation indisponible.',
      }),
      lookupByHandle: vi.fn().mockResolvedValue({ status: 'notFound' }),
      publishIdentity: vi.fn().mockResolvedValue({
        status: 'unavailable',
        message: 'Service cloud indisponible.',
      }),
    };
    const user = userEvent.setup();
    renderProfile({ lookupByHandle: vi.fn() }, repository, cloudIdentityPort);
    await openSocialProfile(user);

    const displayName = screen.getByLabelText('Nom affiché');
    await user.clear(displayName);
    await user.type(displayName, 'Alex local');
    await user.click(screen.getByRole('button', { name: 'Enregistrer' }));

    expect(await screen.findByText('Profil mis à jour')).toBeInTheDocument();
    expect(screen.getAllByText('Profil mis à jour')).toHaveLength(1);
    expect(cloudIdentityPort.publishIdentity).not.toHaveBeenCalled();
    expect(screen.queryByText('Profil enregistré, publication à reprendre')).not.toBeInTheDocument();
  });

"""
          test_source, partial_count = partial_pattern.subn(
              local_first_test,
              test_source,
              count=1,
          )
          if partial_count != 1:
              raise SystemExit(f'Test de réussite partielle attendu une fois, trouvé : {partial_count}.')
          test_path.write_text(test_source, encoding='utf-8')

          e2e_path = Path('e2e/friends-profile-editing.spec.ts')
          e2e_source = e2e_path.read_text(encoding='utf-8')
          old_card = "const socialCard = page.getByLabel('Profil social');"
          new_card = "const socialCard = page.getByLabel('Profil social', { exact: true });"
          if old_card not in e2e_source:
              raise SystemExit('Sélecteur non exact de la carte Profil social introuvable.')
          e2e_source = e2e_source.replace(old_card, new_card, 1)
          old_handle = "page.getByLabel('Identifiant public')"
          new_handle = "page.getByRole('textbox', { name: 'Identifiant public' })"
          if e2e_source.count(old_handle) != 2:
              raise SystemExit('Deux sélecteurs Identifiant public étaient attendus.')
          e2e_path.write_text(e2e_source.replace(old_handle, new_handle), encoding='utf-8')

          print('Correction locale-first et tests associés appliqués.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run targeted lint
        run: npx oxlint src/shared/ui/BottomSheet.tsx src/features/profile/pages/ProfilePage.tsx src/features/profile/pages/ProfilePage.test.tsx src/features/friends/pages/FriendsPrivacyPage.tsx src/features/friends/pages/FriendsPrivacyPage.identity-status.test.tsx src/features/friends/pages/FriendsPrivacyPage.visibility-feedback.test.tsx e2e/profile-editing.spec.ts e2e/friends-profile-editing.spec.ts

      - name: Run targeted unit tests
        run: npx vitest run src/features/profile/pages/ProfilePage.test.tsx src/features/friends/pages/FriendsPrivacyPage.identity-status.test.tsx src/features/friends/pages/FriendsPrivacyPage.visibility-feedback.test.tsx

      - name: Run production build
        run: npm run build

      - name: Run WebKit iPhone and Chromium mobile
        shell: bash
        run: |
          docker run --rm --ipc=host \
            -e CI=1 \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            bash -lc "npx playwright test e2e/profile-editing.spec.ts e2e/friends-profile-editing.spec.ts --project=webkit-iphone-15 --project=chromium-mobile-360"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr24-edit-surface-final-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit validated product correction
        if: success()
        shell: bash
        run: |
          git config user.name 'sportpilot-validation-bot'
          git config user.email 'sportpilot-validation-bot@users.noreply.github.com'
          git add src/shared/ui/BottomSheet.tsx src/features/profile/pages/ProfilePage.tsx src/features/profile/pages/ProfilePage.test.tsx src/features/friends/pages/FriendsPrivacyPage.tsx src/features/friends/pages/FriendsPrivacyPage.identity-status.test.tsx src/features/friends/pages/FriendsPrivacyPage.visibility-feedback.test.tsx e2e/profile-editing.spec.ts e2e/friends-profile-editing.spec.ts
          git rm .github/workflows/pr24-edit-surface-validation.yml .github/workflows/pr24-edit-surface-pr-validation.yml .github/workflows/pr24-edit-surface-rerun.yml .github/workflows/pr24-edit-surface-final-validation.yml .github/workflows/pr24-edit-surface-browser-validation.yml .github/workflows/pr24-edit-surface-build-validation.yml .github/workflows/pr24-edit-surface-source-diagnostic.yml .github/workflows/pr24-edit-surface-local-first-validation.yml
          git commit -m 'fix: éditer les profils dans une surface dédiée'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
