name: PR24 WebKit dark phase validation

on:
  pull_request:
    branches:
      - agent/profile-friends-privacy-ux

permissions:
  contents: write

jobs:
  validate:
    name: Validate accessible dark phase
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply focused patch
        run: python3 .github/scripts/apply_pr24_webkit_dark_phase_fix.py

      - name: Verify focused patch
        run: |
          git diff --check
          npx oxlint e2e/performance-glass-0.34.0.spec.ts e2e/helpers/performanceGlass.ts

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Repeat accessible dark phase on WebKit three times
        run: >-
          npx playwright test
          e2e/performance-glass-0.34.0.spec.ts
          --project=webkit-iphone-15
          --grep "active le thème sombre core via le contrôle accessible"
          --repeat-each=3

      - name: Repeat zenith reveal on WebKit three times
        run: >-
          npx playwright test
          e2e/performance-glass-0.34.0.spec.ts
          --project=webkit-iphone-15
          --grep "capture le reveal unique zenith-gold"
          --repeat-each=3

      - name: Repeat historical scenario on WebKit three times
        run: >-
          npx playwright test
          e2e/performance-glass-0.34.0.spec.ts
          --project=webkit-iphone-15
          --grep "valide les thèmes, graphiques et écrans de décision avec des données contrôlées"
          --repeat-each=3

      - name: Run full visual file on affected browsers
        run: >-
          npx playwright test
          e2e/performance-glass-0.34.0.spec.ts
          --project=webkit-iphone-15
          --project=chromium-mobile-360
          --project=chromium-large-412

      - name: Materialize validated patch
        run: |
          rm .github/scripts/apply_pr24_webkit_dark_phase_fix.py
          rm .github/workflows/pr24-webkit-dark-phase-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(e2e): fiabiliser le thème sombre du harnais visuel"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr24-webkit-dark-phase-failure
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7
