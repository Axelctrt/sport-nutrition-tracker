          audit = replaceOnce(audit, "const checklist = read('RELEASE-CHECKLIST.md');\n  for (const marker of [\n    'SportPilot 1.0.2',", "const checklist = read('RELEASE-CHECKLIST.md');\n  for (const marker of [\n    'SportPilot 1.0.3',", 'audit checklist version');
