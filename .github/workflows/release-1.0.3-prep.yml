La Preview finale versionnée, \`develop → main\`, le tag \`v1.0.3\`, la GitHub Release et la production restent des gates techniques séquentiels.
`);

          write('INSTALLATION.txt', `SPORTPILOT 1.0.3 - HOTFIX CONTINUITE GOALS

Checklist de qualification :
1. Verifier develop@e4b0992ad3b524a529e6962f54407235263f6fa5.
