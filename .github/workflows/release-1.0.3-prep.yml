8. Verifier Dexie v12, sauvegarde JSON v10 et runtime Dexie Cloud v16.
9. Verifier que la whitelist automatique reste Strength + Goals + Weights.
10. Publier une Preview Pages Direct Upload du SHA final exact.
11. Verifier le CORS Dexie de l'origine immuable.
12. Promouvoir develop vers main uniquement apres les gates verts.
13. Taguer v1.0.3 et publier la GitHub Release uniquement sur le SHA publie.
14. Deployer la production Pages depuis ce meme SHA.
15. Qualifier le compte legacy Goals reel avant nettoyage CORS Preview.
16. Ne lancer aucune migration D1.

Aucune formule calorique, aucun theme et aucun elargissement IA ne sont inclus.
`);

          write('ROLLBACK.md', `# Retour arrière — SportPilot 1.0.3

## Référence stable précédente

- version : \`1.0.2\` ;
- \`main\` : \`6e479170731d689683822374ba7c74fff425730d\` ;
- tag : \`v1.0.2\` ;
- production : \`https://sportpilot-pages.pages.dev\`.

Candidate 1.0.3 préparée depuis :

- \`develop@e4b0992ad3b524a529e6962f54407235263f6fa5\` ;
- branche \`release/1.0.3\`.

## Compatibilité des données

La maintenance 1.0.3 ne change aucun schéma :

- Dexie v12 ;
- sauvegarde JSON v10 ;
- runtime Dexie Cloud v16 ;
- aucune migration D1.

## Stratégie en cas d'incident

1. STOP si perte de données, écrasement, contamination inter-compte, doublon persistant ou crash bloquant est observé.
2. Préserver IndexedDB et les données cloud ; ne jamais nettoyer les bases pour masquer le symptôme.
3. Identifier le SHA et le deployment Pages exacts concernés.
4. Préférer un correctif en avant compatible avec Dexie v12.
5. Un redéploiement d'un deployment immuable antérieur n'est envisagé qu'après vérification explicite de la compatibilité des données.
6. Ne lancer aucune migration D1 lors d'un rollback de cette maintenance.

Les formules calories/macros, les thèmes et le périmètre IA ne sont pas modifiés par cette maintenance.
`);

          const readmePath = 'README.md';
          const oldReadme = read(readmePath);
          const readmeAnchor = '## Socle stable V1 conservé';
          const readmeIndex = oldReadme.indexOf(readmeAnchor);
          if (readmeIndex < 0) throw new Error('README stable anchor missing');
          const readmeTail = oldReadme.slice(readmeIndex);
          const readmeHead = `# SportPilot 1.0.3

SportPilot \`1.0.3\` prépare le hotfix de continuité Goals qualifié depuis \`develop@e4b0992ad3b524a529e6962f54407235263f6fa5\`.

