      - name: Commit release preparation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/release-1.0.3-prep.yml
          git add -A
          git commit -m "chore(release): préparer SportPilot 1.0.3"
          git push origin HEAD:release/1.0.3
