          write(readmePath, readmeHead + readmeTail);

          const auditPath = 'scripts/audit-release-consolidation.mjs';
          let audit = read(auditPath);
          audit = replaceOnce(audit, "  'RELEASE-NOTES-1.0.2.md',\n  'CHANGELOG.md',", "  'RELEASE-NOTES-1.0.2.md',\n  'RELEASE-NOTES-1.0.3.md',\n  'CHANGELOG.md',", 'audit required release notes');
          audit = replaceOnce(audit, "if (packageJson.version !== '1.0.2') {\n    fail(`package.json doit préparer 1.0.2, reçu ${packageJson.version}.`);\n  }", "if (packageJson.version !== '1.0.3') {\n    fail(`package.json doit préparer 1.0.3, reçu ${packageJson.version}.`);\n  }", 'audit package version');
          audit = replaceOnce(audit, "const releaseNotes = read('RELEASE-NOTES-1.0.2.md');", "const releaseNotes = read('RELEASE-NOTES-1.0.3.md');", 'audit current release notes');
          audit = replaceOnce(audit, "'SportPilot 1.0.2 — continuité sûre Goals + Weights'", "'SportPilot 1.0.3 — hotfix continuité Goals'", 'audit notes title');
          audit = replaceOnce(audit, "'Branche : `release/1.0.2`'", "'Branche : `release/1.0.3`'", 'audit release branch');
          audit = replaceOnce(audit, "'develop@37cae57dc779d6410f35a177403706be0a3eb382'", "'develop@e4b0992ad3b524a529e6962f54407235263f6fa5'", 'audit release base');
