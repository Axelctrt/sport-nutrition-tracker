- [ ] CORS Dexie Cloud vérifié pour l'origine immuable finale.
- [ ] PR \`develop → main\`.
- [ ] CI de \`main\`.
- [ ] Tag \`v1.0.3\`.
- [ ] GitHub Release SportPilot 1.0.3.
- [ ] Production Pages du SHA publié, sans migration D1.
- [ ] Smoke legacy Goals réel puis non-régression rapide Strength/Weights.
- [ ] Nettoyage CORS des Previews uniquement après smoke production vert.
- [x] Aucun tag créé par la préparation.
- [x] Aucune migration D1 prévue.

#141 et #146 restent terminées. #162 suit le résiduel Quagga/Sharp accepté pour V1. #138 reste la dette distincte des Workers Builds Cloudflare.

## Archive 1.0.2 — publiée le 17 août 2026

- PR de publication : #175.
- Commit publié : \`6e479170731d689683822374ba7c74fff425730d\`.
- Tag : \`v1.0.2\`.
- GitHub Release : SportPilot 1.0.2.
- Production : \`https://sportpilot-pages.pages.dev\`.
- Dexie v12, sauvegarde JSON v10 et runtime Dexie Cloud v16.
- Aucune migration D1.

${archivedTail}`;
          write(checklistPath, checklist);

          const limitationsPath = 'KNOWN-LIMITATIONS.md';
          let limitations = read(limitationsPath);
          limitations = replaceOnce(limitations, '# Limitations connues — SportPilot 1.0.2', '# Limitations connues — SportPilot 1.0.3', 'known limitations title');
          limitations = replaceAllRequired(limitations, 'La maintenance `1.0.2`', 'La maintenance `1.0.3`', 'known limitations maintenance');
          limitations = replaceAllRequired(limitations, 'maintenance 1.0.2', 'maintenance 1.0.3', 'known limitations trailing maintenance');
          write(limitationsPath, limitations);

          write('README-PATCH.md', `# SportPilot 1.0.3 — hotfix continuité Goals

Branche : \`release/1.0.3\`.

Base fonctionnelle qualifiée :
\`develop@e4b0992ad3b524a529e6962f54407235263f6fa5\`.

Ce lot prépare uniquement la publication du hotfix Goals déjà fusionné via #176 et qualifié sur Preview fonctionnelle. Il ne réimplémente aucun comportement métier.

Garanties conservées :

- réconciliation initiale Goals legacy explicite ;
- \`unknown\` et \`both\` fail-closed hors parcours initial autorisé ;
- automatisme Strength + Goals + Weights uniquement ;
- Dexie v12 ;
- sauvegarde JSON v10 ;
- runtime Dexie Cloud v16 ;
