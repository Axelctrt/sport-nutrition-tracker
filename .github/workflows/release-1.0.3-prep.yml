name: Release 1.0.3 preparation

on:
  push:
    branches:
      - release/1.0.3
    paths:
      - .github/workflows/release-1.0.3-prep.yml

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v6
        with:
          ref: release/1.0.3
          fetch-depth: 0

      - name: Prepare SportPilot 1.0.3 metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, value) => fs.writeFileSync(p, value.endsWith('\n') ? value : value + '\n');
          const replaceOnce = (source, from, to, label) => {
            const index = source.indexOf(from);
            if (index < 0) throw new Error(`Missing marker for ${label}: ${from}`);
            if (source.indexOf(from, index + from.length) >= 0) throw new Error(`Ambiguous marker for ${label}: ${from}`);
            return source.slice(0, index) + to + source.slice(index + from.length);
          };
          const replaceAllRequired = (source, from, to, label) => {
            if (!source.includes(from)) throw new Error(`Missing marker for ${label}: ${from}`);
            return source.split(from).join(to);
          };

          const pkgPath = 'package.json';
          const pkg = JSON.parse(read(pkgPath));
          if (pkg.version !== '1.0.2') throw new Error(`Unexpected package version: ${pkg.version}`);
          pkg.version = '1.0.3';
          write(pkgPath, JSON.stringify(pkg, null, 2));

          const lock = JSON.parse(read('package-lock.json'));
          if (lock.version !== '1.0.3' || lock.packages?.['']?.version !== '1.0.3') {
            throw new Error('package-lock.json is not already aligned on 1.0.3');
          }

          const proxyPath = 'functions/_shared/openFoodFactsProxy.js';
          let proxy = read(proxyPath);
          proxy = replaceOnce(
            proxy,
            'SportPilot/1.0.2 (Cloudflare Pages; Open Food Facts integration)',
            'SportPilot/1.0.3 (Cloudflare Pages; Open Food Facts integration)',
            'Open Food Facts User-Agent',
          );
          write(proxyPath, proxy);

          const versionAssertion = "expect(__APP_VERSION__).toBe('1.0.2');";
          const nextVersionAssertion = "expect(__APP_VERSION__).toBe('1.0.3');";
          let assertionUpdates = 0;
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(?:ts|tsx)$/.test(entry.name)) {
                const before = read(full);
                if (!before.includes(versionAssertion)) continue;
                const count = before.split(versionAssertion).length - 1;
                write(full, before.split(versionAssertion).join(nextVersionAssertion));
                assertionUpdates += count;
              }
            }
          };
          walk('src');
          if (assertionUpdates === 0) throw new Error('No active __APP_VERSION__ assertion was updated.');

          const overviewPath = 'src/features/settings/components/SettingsOverview.test.tsx';
          let overview = read(overviewPath);
          overview = replaceOnce(overview, "screen.getByText('1.0.2')", "screen.getByText('1.0.3')", 'SettingsOverview version');
          write(overviewPath, overview);

          const notes = `# SportPilot 1.0.3 — hotfix continuité Goals

Branche : \`release/1.0.3\`.

Base fonctionnelle qualifiée :
\`develop@e4b0992ad3b524a529e6962f54407235263f6fa5\`.

Tree fonctionnel qualifié :
\`d4b8fd24466f04d4fee4e5966ec2b9edf1a69ba2\`.

Stable publiée avant ce hotfix : SportPilot 1.0.2,
\`main@6e479170731d689683822374ba7c74fff425730d\`, tag \`v1.0.2\`.

## Correctifs Goals

- Les comptes historiques sans baseline et avec des Goals divergents restent en provenance \`unknown\` et strictement fail-closed.
- Un parcours dédié **Réconcilier les objectifs** permet une première réconciliation explicite : **conserver cet appareil** ou **utiliser le cloud**.
- L’aperçu montre les Goals concernés avec leur titre, leur état compréhensible sur cet appareil et dans le cloud, ainsi que la conséquence du choix global ; aucun jargon tombstone n’est exposé.
- La résolution revalide compte, état local, état cloud et stamp avant toute écriture ; une concurrence annule l’opération.
- La baseline n’est établie qu’après convergence vérifiée, afin que les changements suivants redeviennent \`local-only\` ou \`cloud-only\`.
- \`both\` reste sans résolution dans ce hotfix.
- Le merge générique et le CTA global ne peuvent plus contourner le fail-closed de Goals en \`unknown\` ou \`both\`.

## Persistance et automatisme

- \`GOAL_STATE_CHANGED_EVENT\` conserve sa sémantique de réactivité UI immédiate.
- \`GOAL_STATE_PERSISTED_EVENT\` signifie exclusivement qu’une mutation Goals locale est durablement persistée dans AppDatabase.
- Création/modification : signal après succès de persistance.
- Suppression : signal après transaction Goal + suppression durable réussie.
- Échec de persistance ou reload après download cloud : aucun signal persisted.
- Le gate nominal A → B utilise le vrai \`writeGoalState()\`, sans émission artificielle.

## Diagnostic

- Le détail Objectifs est réellement monté sur \`/settings/sync-prototype\`.
- La provenance réelle \`local\`, \`cloud\`, \`both\` ou \`unknown\` est visible.
- Aucune action directionnelle n’est proposée pour \`unknown\` ou \`both\` hors du parcours initial explicite autorisé pour \`unknown\` sans baseline.

## Qualification acquise avant bump

- CI post-merge develop #871 : 4/4 jobs verts.
- Preview fonctionnelle immuable : \`https://e00b2869.sportpilot-pages.pages.dev\`.
- Manifest SHA-256 : \`79fdf99c183a519760e22fbfe03c406d5deb8f97b93782a340e8a90420deca53\`.
- CORS de l’origine immuable : PASS ; alias : NOT_ALLOWED.
- Smoke physique Preview Goals A → B sans synchronisation manuelle : PASS.
- Le smoke physique du compte legacy divergent réel reste un gate post-déploiement sur l’origine production, où l’état IndexedDB historique existe encore.

## Invariants

- Synchronisation automatique sûre : Strength + Goals + Weights uniquement.
- \`local-only\` → upload directionnel ; \`cloud-only\` → download directionnel.
- \`both\` / \`unknown\` → aucune écriture automatique.
- Strength et Weights inchangés hors tests de non-régression.
- Dexie v12.
- sauvegarde JSON v10.
- runtime Dexie Cloud v16.
- aucune migration D1.
- aucune modification des formules calories/macros.
- aucun changement de thème validé.
- aucun élargissement IA.

Toute différence fonctionnelle hors de ce périmètre bloque la publication.
`;
          write('RELEASE-NOTES-1.0.3.md', notes);

          const changelogPath = 'CHANGELOG.md';
          let changelog = read(changelogPath);
          const changelogAnchor = '## 1.0.2 — continuité Goals + Weights en préparation';
          if (!changelog.includes(changelogAnchor)) throw new Error('CHANGELOG 1.0.2 anchor missing');
          const changelog103 = `## 1.0.3 — hotfix continuité Goals en préparation

- Première réconciliation explicite des comptes Goals historiques divergents, sans conversion automatique de \`unknown\`.
- Aperçu réel objectif par objectif avant le choix global local/cloud.
- Signal post-persistance Goals strict pour l’automatisme A → B.
- Refus des résolutions Goals \`unknown\` / \`both\` dans tous les chemins produit, y compris le merge global.
- Détail Objectifs réparé sur la vraie route \`/settings/sync-prototype\`.
- Preview fonctionnelle \`e00b2869\` et smoke A → B validés.
- Dexie v12, sauvegarde JSON v10 et runtime Dexie Cloud v16 inchangés ; aucune migration D1.

Cette entrée prépare \`1.0.3\` ; la Preview finale versionnée, \`main\`, le tag, la GitHub Release et la production restent des gates distincts.

Voir [\`RELEASE-NOTES-1.0.3.md\`](RELEASE-NOTES-1.0.3.md).

`;
          changelog = changelog.replace(changelogAnchor, changelog103 + '## 1.0.2 — publiée le 17 août 2026');
          changelog = replaceOnce(
            changelog,
            "Cette entrée prépare `1.0.2` ; le tag, la GitHub Release et la production\nrestent des gates distincts.",
            "Publication : `main@6e479170731d689683822374ba7c74fff425730d`, tag `v1.0.2`, GitHub Release SportPilot 1.0.2 et production `https://sportpilot-pages.pages.dev`.",
            'CHANGELOG 1.0.2 publication status',
          );
          write(changelogPath, changelog);

          const checklistPath = 'RELEASE-CHECKLIST.md';
          const oldChecklist = read(checklistPath);
          const archiveAnchor = '## Archive 1.0.1 — publiée le 17 août 2026';
          const archiveIndex = oldChecklist.indexOf(archiveAnchor);
          if (archiveIndex < 0) throw new Error('Release checklist archive anchor missing');
          const archivedTail = oldChecklist.slice(archiveIndex);
          const checklist = `# Checklist de publication — SportPilot 1.0.3

Base fonctionnelle qualifiée :
\`develop@e4b0992ad3b524a529e6962f54407235263f6fa5\`.

Tree fonctionnel qualifié :
\`d4b8fd24466f04d4fee4e5966ec2b9edf1a69ba2\`.

Branche de préparation : \`release/1.0.3\`.

